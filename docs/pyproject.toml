[project]
name = "collective-multiworkflow-docs"
description = "Assign additional workflows to content types through behaviors, with full support in plone.restapi and Volto."
version = "1.0.0"
keywords = [
    "Multi-Workflow Support for Plone",
    "documentation",
    "Plone",
    "Diátaxis",
]
readme = "README.md"
requires-python = "==3.14.*"
license = { file = "LICENSE.md" }
maintainers = [
    { name = "Érico Andrei", email = "ericof@plone.org" },
]
authors = [
    { name = "Érico Andrei", email = "ericof@plone.org" },
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "collective-multiworkflow",
]

[dependency-groups]
dev = [
    "graphviz",
    "linkify-it-py",
    "myst-parser",
    "plone-sphinx-theme",
    "sphinx-autobuild",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-examples",
    "sphinx-notfound-page",
    "sphinx-reredirects",
    "sphinx-sitemap",
    "sphinx-tippy",
    "sphinxcontrib-httpdomain",
    "sphinxcontrib-httpexample",
    "sphinxcontrib-mermaid",
    "sphinxext-opengraph",
    "vale",
]

[project.urls]
Repository = "https://github.com/collective/collective-multiworkflow"
Documentation = "https://collective.github.io/collective-multiworkflow/"

[tool.uv.sources]
collective-multiworkflow = { path = "../backend/", editable = true }
